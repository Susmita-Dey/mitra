[package]
name = "mitra"
version = "0.1.0"
description = "Your tiny open-source desktop companion."
authors = ["you"]
edition = "2021"

[lib]
name = "mitra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
