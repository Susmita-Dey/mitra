name: First Interaction
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: First interaction
        uses: actions/first-interaction@v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to Mitra! Thank you for opening your very first issue. A maintainer will review it shortly."
          pr-message: "Welcome to Mitra! Thank you for submitting your first pull request. We appreciate your contribution."
