name: Plugin & Security Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. TypeScript & Build
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 TypeScript & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Bundle size check
        shell: pwsh
        run: |
          $gzip = (Get-Item dist/assets/*.js | Where-Object { $_.Name -notmatch 'map' } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $ms = New-Object System.IO.MemoryStream
            $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
            $gz.Write($bytes, 0, $bytes.Length)
            $gz.Close()
            $ms.Length
          } | Measure-Object -Sum).Sum
          $kb = [Math]::Round($gzip / 1024, 1)
          Write-Host "Gzipped bundle: ${kb} KB"
          if ($gzip -gt 512000) {
            Write-Error "Bundle exceeds 500 KB gzip limit (${kb} KB). Please optimize."
            exit 1
          }

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Plugin Security Scan
  # ──────────────────────────────────────────────────────────────────────────
  plugin-security:
    name: 🔒 Plugin Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for forbidden APIs in plugin files
        run: |
          PLUGINS_DIR="src/plugin"
          echo "Scanning plugin files for forbidden APIs..."
          VIOLATIONS=0

          # List of forbidden patterns
          FORBIDDEN=(
            "eval("
            "new Function("
            "document.querySelector"
            "document.getElementById"
            "document.write"
            "innerHTML"
            "outerHTML"
            "insertAdjacentHTML"
            "setTimeout("
            "setInterval("
            "window.__mitra"
            "<script"
          )

          for file in $(find $PLUGINS_DIR -name "*.ts" -o -name "*.tsx"); do
            for pattern in "${FORBIDDEN[@]}"; do
              if grep -n "$pattern" "$file" 2>/dev/null; then
                echo "❌ VIOLATION in $file: '$pattern' is forbidden in plugins"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo "::error::$VIOLATIONS security violation(s) found. See PLUGIN_CONTRIBUTING.md"
            exit 1
          fi

          echo "✅ No security violations found in plugin files."

      - name: Verify plugin manifests have required fields
        run: |
          echo "Checking plugin manifests..."
          for file in $(find src/plugin/examples -name "*.ts"); do
            if ! grep -q '"id"' "$file" 2>/dev/null && ! grep -q "id:" "$file" 2>/dev/null; then
              echo "::warning::Plugin $file may be missing a manifest id"
            fi
            if ! grep -q '"permissions"' "$file" 2>/dev/null && ! grep -q "permissions:" "$file" 2>/dev/null; then
              echo "::warning::Plugin $file may be missing permissions declaration"
            fi
          done
          echo "✅ Manifest checks complete."

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Dependency Audit
  # ──────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: 🛡️ Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for known vulnerabilities
        run: bunx audit-ci --moderate || echo "::warning::Audit warnings found. Review before merging."



  # ──────────────────────────────────────────────────────────────────────────
  # 4. Rust / Tauri Backend Build
  # ──────────────────────────────────────────────────────────────────────────
  rust-check:
    name: 🦀 Rust Security & Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy lint (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo audit (Rust dependency vulnerabilities)
        run: |
          cargo install cargo-audit --quiet
          cd src-tauri && cargo audit
